chor="start">→ ship-auth (payment-adequate) gates SHIPPED</text><text x="902" y="775.296" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">→ Hold suppresses child from My Tasks</text><text x="902" y="787.496" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">→ Closed–Nonpayment ⇒ Active/Closed = Closed</text><rect x="40" y="820" width="1084" height="44" rx="2" fill="#ffffff" stroke="#d6b656" stroke-width="1.4"/><text x="48" y="842" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">Flags:   Active / Closed        ·        Financial Status:   OK  /  Hold–Awaiting Payment  /  Closed–Nonpayment</text><rect x="20" y="888" width="720" height="108" rx="2" fill="#f5f5f5" stroke="#b3b3b3" stroke-width="1.4"/><text x="28" y="903" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">CLOCK  •  Numeric-deadline states:  extended_due = received + statutory_days + implied_extension</text><text x="28" y="915.2" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">(implied_extension = 0 default; triggers: clarification · “additional time” letter · no-record contact-us +3d)</text><text x="28" y="927.4" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">•  Soft-standard states (e.g. OH “promptly / reasonable” — no number):  NO legal due date →</text><text x="28" y="939.6" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">city sets an internal OPERATIONAL target (drives My Tasks / aging), explicitly NOT a legal deadline.</text><rect x="760" y="888" width="400" height="74" rx="2" fill="#f5f5f5" stroke="#b3b3b3" stroke-width="1.4"/><text x="768" y="903" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">VISIBILITY  My Tasks = child Process Status (hidden on Hold)</text><text x="768" y="915.2" font-size="9.6" font-weight="400" fill="#222" text-anchor="start">Request Queue = parent Active/Closed (Hold shown, not removed)</text></svg>